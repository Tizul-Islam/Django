{% extends 'base.html' %}

{% block title %}Password Reset Complete | Django Auth{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card auth-card p-4 text-center">
            <div class="mb-3">
                <span class="badge bg-success-subtle text-success p-3 rounded-circle fs-3">
                    <i class="bi bi-check-circle-fill"></i>
                </span>
            </div>
            <h4 class="fw-bold mb-2">Password Successfully Reset!</h4>
            <p class="text-muted small">
                Your new password has been set. You can now proceed to log in with your new credentials.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
